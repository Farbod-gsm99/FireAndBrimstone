behaviors:
  CubeAgent:
    trainer_type: ppo
    hyperparameters:
      # Tuned for 16 parallel arenas on RTX 4060 Ti (16GB VRAM) with Discrete Actions
      batch_size: 512
      buffer_size: 16384
      learning_rate: 0.0003
      # Training logs showed near-maximum policy entropy late into the run.
      # Reduce the entropy bonus so PPO can commit to useful movement choices.
      beta: 0.0005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 4500000
    time_horizon: 256
    summary_freq: 10000
    threaded: false

engine_settings:
  width: 1280
  height: 720
  quality_level: 1
  time_scale: 1.0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
